# Weekly (and on demand): fetch what 1200-1600 players play in your openings from Lichess, find traps,
# extra branches, longer lines and model games, rebuild the drill cards and publish the app.
# Needs the repository secret LICHESS_TOKEN (a Lichess key with no permissions ticked).
name: Opening statistics

on:
  schedule:
    - cron: "41 3 * * 1"     # Mondays 05:41 in Warsaw (summer time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-games      # never at the same time as the games update (both commit to main)
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install chess==1.11.2
      - name: Download Stockfish 19 (Linux)
        run: |
          mkdir -p engine
          curl -sL https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz | tar -xz -C engine
          find engine -type f -name 'stockfish*' -exec chmod +x {} \;
      - name: Opening statistics, traps, extra lines, model games
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: python build_explorer.py
      - name: Drill cards (include the extra lines)
        run: python build_openings.py
      - name: Rebuild the app
        run: python build.py --skip-drills
      - name: Publish if anything changed
        run: |
          git config user.name "chess-trainer-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then echo "Nothing changed."; else
            git commit -m "Opening statistics updated"
            git pull --rebase
            git push
          fi
