<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T2 dev harness</title>
<!-- Dev harness for the Train 2 UI. Serve the REPO ROOT (python -m http.server 8800) and open /train2/ui/dev.html.
     It borrows the app's real stylesheet from ../../app.html, vendored chess.js + chessground (+ Stockfish for "Show why"),
     and stands in for record/progress/sfx. Progress: localStorage 'ct.t2dev.progress'. Clock: the dev bar sets ct.t2now.
     Data: fixtures/ (make_fixtures.py). Override with ?train=..&puzzles=..&mine=.. ("none" = file missing). -->
<link rel="stylesheet" href="../../vendor/chessground.base.css">
<link rel="stylesheet" href="../../vendor/chessground.brown.css">
<link rel="stylesheet" href="../../vendor/chessground.cburnett.css">
<style id="app-css"></style>
<link rel="stylesheet" href="t2.css">
<style>
  #devbar { position: sticky; top: 0; z-index: 35; background: #222; color: #eee; font: 12px/1.3 system-ui, sans-serif; padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #devbar button { font: 12px system-ui; padding: 4px 8px; border-radius: 5px; border: 1px solid #555; background: #333; color: #eee; cursor: pointer; }
  #devbar b { color: #ffd166; }
  #glossary { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 80; display: grid; place-items: center; padding: 16px; }
  #glossary .card { max-width: 420px; }
</style>
<script src="../../vendor/pwa/chess.min.js"></script>
</head>
<body>
<div id="devbar">
  <span>T2 dev · clock: <b id="dev-clock">real</b></span>
  <button data-shift="1">+1 day</button><button data-shift="3">+3 days</button><button data-shift="7">+1 week</button><button data-shift="0">Real clock</button>
  <button id="dev-reset">Reset progress</button><button id="dev-seed">Seed old data</button><button id="dev-r5">R3/R5 test</button>
  <span id="dev-info"></span>
</div>
<main class="wrap"><section class="view" id="view-train"><div id="t2-slot"></div></section></main>
<nav id="nav" aria-label="Fake app tabs"><button>Today</button><button>Openings</button><button aria-current="page">Train</button><button>Games</button><button>Stats</button></nav>
<div id="glossary" hidden><div class="card"><h3 id="gl-t"></h3><p id="gl-d"></p><button class="btn" id="gl-close">Close</button></div></div>
<script type="module">
import { Chessground } from '../../vendor/pwa/chessground.min.js';

const appHtml = await fetch('../../app.html').then(r => r.text());
document.getElementById('app-css').textContent = (appHtml.match(/<style>([\s\S]*?)<\/style>/) || ['', ''])[1].replace('/*CG_CSS*/', '');
document.getElementById('t2-slot').outerHTML = await fetch('t2.html').then(r => r.text());
await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 't2core.js'; s.onload = res; s.onerror = rej; document.head.append(s); });
for (const f of ['t2play.js', 't2stats.js']) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = f; s.onload = res; s.onerror = rej; document.head.append(s); });

const q = new URLSearchParams(location.search);
const get = (k, d) => { const u = q.get(k) || d; return u === 'none' ? Promise.resolve(null) : fetch(u).then(r => r.ok ? r.json() : null).catch(() => null); };
const [train, puzzles, mine, GAMES] = await Promise.all([get('train', 'fixtures/train2.dev.json'), get('puzzles', 'fixtures/puzzles2.sample.json'), get('mine', 'fixtures/mine2.sample.json'),
  fetch('../../data/analysis.json').then(r => r.json()).catch(() => [])]);

const store = {
  get(k, d) { try { const v = localStorage.getItem('ct.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('ct.' + k, JSON.stringify(v)); } catch {} },
};
const progress = store.get('t2dev.progress', {});
for (const k of ['tr', 'trh', 'puz', 'solved', 'pun', 'chk', 'eg']) progress[k] ||= {};
function record(kind, id, value) { (progress[kind] ||= {})[id] = { ...value, t: Date.now() }; store.set('t2dev.progress', progress); }
const sfx = { on: store.get('sound', false), play(k) { if (this.on) console.debug('sfx', k); } };
// the vendored Stockfish as a tiny engine.go(fen, {movetime}) -> {best, score} (same shape as the app's)
const engine = {
  w: null, q: Promise.resolve(),
  go(fen, { movetime = 800 } = {}) {
    const run = () => new Promise(res => {
      if (!this.w) { this.w = new Worker('../../vendor/pwa/stockfish.js'); this.w.postMessage('uci'); }
      let last = null;
      this.w.onmessage = e => { const l = String(e.data); if (l.startsWith('info') && l.includes(' score ')) last = l;
        else if (l.startsWith('bestmove')) { const m = last?.match(/score (cp|mate) (-?\d+)/); res({ best: l.split(' ')[1], score: m ? { [m[1]]: +m[2] } : { cp: 0 } }); } };
      this.w.postMessage('position fen ' + fen); this.w.postMessage('go movetime ' + movetime);
    });
    const p = this.q.then(run, run); this.q = p.catch(() => {}); return p;
  },
};
window.T2 = T2; window.progress = progress;
T2.init({ root: document.getElementById('t2'), data: { train, puzzles, mine }, hooks: { Chessground, record, progress, store, sfx, confetti: () => console.debug('confetti'), games: GAMES, engine,
  myRating: GAMES.length ? GAMES[GAMES.length - 1].myRating : 1400, dev: true, analyse: fen => alert('Analyse: ' + fen), onChange: () => info() } });
T2.GLOSSARY.forEach(([id, t, d]) => (window.GL ||= {})[id] = [t, d]);
document.addEventListener('click', e => { const b = e.target.closest('.gl[data-term]'); if (!b) return; e.preventDefault(); e.stopPropagation();
  const [t, d] = GL[b.dataset.term] || [b.dataset.term, '']; document.getElementById('gl-t').textContent = t; document.getElementById('gl-d').textContent = d; document.getElementById('glossary').hidden = false; }, true);
document.getElementById('gl-close').onclick = () => document.getElementById('glossary').hidden = true;

function info() {
  const v = localStorage.getItem('ct.t2now');
  document.getElementById('dev-clock').textContent = v ? new Date(T2.now()).toLocaleString('en-GB') : 'real';
  const s = T2.dueSummary(), p = T2.dailyPlan();
  document.getElementById('dev-info').textContent = `due ${s.n} · t2c ${Object.keys(progress.t2c || {}).length} · t2l ${Object.keys(progress.t2l || {}).length} · seen ${T2.srs.seen().size} · plan rev ${p.revN} puz ${p.puzN} think ${p.thinkN}`;
}
document.getElementById('devbar').onclick = e => {
  const b = e.target.closest('[data-shift]');
  if (b) { const d = +b.dataset.shift; if (!d) localStorage.removeItem('ct.t2now'); else localStorage.setItem('ct.t2now', String(T2.now() + d * 86400000)); T2.refresh(); info(); }
  if (e.target.id === 'dev-reset' && confirm('Reset all T2 dev progress?')) { localStorage.removeItem('ct.t2dev.progress'); localStorage.removeItem('ct.t2now'); localStorage.removeItem('ct.puzseen'); location.reload(); }
  if (e.target.id === 'dev-seed') {   // old-app progress: 5 seen Lichess puzzles (puz + ct.puzseen), 6 solved drills, 3 punished, 4 blunder checks
    const rows = T2.puzzles()?.rows || [], m = T2.mine();
    rows.slice(0, 3).forEach(p => record('puz', p.id, { ok: 1 }));
    store.set('puzseen', Object.fromEntries(rows.slice(3, 5).map(p => [p.id, Date.now() - 86400000])));
    (m?.cards || []).filter(c => c.type === 'fix').slice(0, 6).forEach(c => record('solved', c.id.slice(4), {}));
    (m?.cards || []).filter(c => c.type === 'pun').slice(0, 3).forEach(c => record('pun', c.id.slice(4), { ok: 1 }));
    (m?.judges || []).slice(0, 4).forEach(j => record('chk', j.id.slice(4), { ok: 1 }));
    alert('Seeded: 5 seen puzzles, 6 solved drills, 3 punished, 4 checks. Reloading.'); location.reload();
  }
  if (e.target.id === 'dev-r5') {
    const a = T2.test.simulate(3000), b = T2.test.simulate(600, { group: 1 });
    const msg = `R5 mixed: ${JSON.stringify(a)}\nR3 one theme: ${JSON.stringify(b)}`;
    console.log(msg); window.R5 = { a, b }; alert(msg);
  }
};
info();
// test helper: screen point of a square
window.fc = s => {
  const r = document.querySelector('#t2board cg-container').getBoundingClientRect();
  const black = document.querySelector('#t2board .cg-wrap')?.classList.contains('orientation-black') || document.querySelector('#t2board').classList.contains('orientation-black');
  const f = s.charCodeAt(0) - 97, rk = +s[1] - 1, x = black ? 7 - f : f, y = black ? rk : 7 - rk;
  return [Math.round(r.left + (x + .5) * r.width / 8), Math.round(r.top + (y + .5) * r.height / 8)];
};
</script>
</body>
</html>
